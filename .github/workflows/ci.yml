name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build artifact must be committed
        run: |
          npm run build:client
          git diff --exit-code -- client.js
      - name: Package must stay installable
        run: npm pack --dry-run

      # Windows PowerShell 5.1 decodes a BOM-less .ps1 with the system ANSI code
      # page, so Chinese literals turn into mojibake and the parser dies on
      # quotes/braces. Every shipped .ps1 must carry a UTF-8 BOM.
      - name: PowerShell scripts must be UTF-8 with BOM
        shell: pwsh
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $b = [System.IO.File]::ReadAllBytes($_.FullName)
            $ok = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            if (-not $ok) { $bad += $_.FullName }
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "missing BOM: $_" -ForegroundColor Red }
            exit 1
          }
          Write-Host "all .ps1 files carry a UTF-8 BOM"